name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-grupomaisb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/known_hosts <<'EOF'
          161.97.108.92 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF7OYxhEmbnF+vPFNivasqL7MGjc4JtVZgAPMcoyiZce
          EOF
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null' EXIT
          ssh-add - <<< "$VPS_SSH_KEY"
          ssh -p 22 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            root@161.97.108.92 <<'REMOTE'
          set -e
          cd /opt/grupomaisb-site/app
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          docker compose -f docker-compose.prod.yml build --progress=plain
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          docker builder prune -f --keep-storage 500MB
          echo "=== CONTAINER STATUS ==="
          docker compose -f docker-compose.prod.yml ps
          echo "=== WEB LOGS ==="
          docker compose -f docker-compose.prod.yml logs --tail 30 web
          REMOTE
